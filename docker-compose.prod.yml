# Production stack for ONE VM (AWS EC2):   nginx (frontend) -> FastAPI backend -> PostgreSQL
#
#   cp .env.production.example .env      # then fill it in (see DEPLOY.md)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Optional profiles:  --profile tls (Let's Encrypt renewal)   --profile ollama (local LLM)
#
# Expects the frontend repo cloned NEXT TO this one:  ../Case2Code-frontend
#
# The backend runs ONE worker on purpose (realtime rooms, locks and rate limiters are
# in-process memory); do not scale it with --workers or `deploy.replicas`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-case2code}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-case2code_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [case2code_network]
    logging: *default-logging
    # No `ports:` on purpose: the database is only reachable from the compose network.

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-case2code}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-case2code_db}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-hybrid}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5-coder:3b}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [case2code_network]
    logging: *default-logging
    # No `ports:`: only nginx (frontend) is exposed. The image HEALTHCHECK calls /api/health.

  frontend:
    build:
      context: ../Case2Code-frontend
    restart: unless-stopped
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    networks: [case2code_network]
    logging: *default-logging

  certbot:
    image: certbot/certbot
    profiles: ["tls"]
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    networks: [case2code_network]
    logging: *default-logging

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama:/ollama:ro
    networks: [case2code_network]
    logging: *default-logging

networks:
  case2code_network:
    driver: bridge

volumes:
  postgres_data:
  certbot_etc:
  certbot_www:
  ollama_data:
